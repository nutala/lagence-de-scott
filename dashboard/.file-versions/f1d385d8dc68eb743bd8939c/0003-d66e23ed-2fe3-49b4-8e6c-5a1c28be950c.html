<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — L'Agence de Scott</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#040a12;--surface:#08162a;--surface-raised:#0c2340;--surface-hover:#102d52;
--fg:#f1f5f9;--muted:#94a3b8;--muted-dim:#8494a7;
--border:rgba(255,255,255,0.08);--border-light:rgba(255,255,255,0.12);
--accent:#ca6e0d;--accent-hover:#e88318;--accent-surface:rgba(202,110,13,0.12);
--success:#5a9c3f;--success-surface:rgba(90,156,63,0.12);
--danger:#dc2626;--danger-surface:rgba(220,38,38,0.12);
--warning:#eab308;--warning-surface:rgba(234,179,8,0.12);
--info:#3b82f6;--info-surface:rgba(59,130,246,0.12);
--radius:10px;--radius-lg:14px;--radius-xl:20px;
--sidebar-w:260px;--sidebar-collapsed:72px;--header-h:64px;
--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;
--shadow-sm:0 1px 3px rgba(0,0,0,0.3);--shadow-md:0 4px 16px rgba(0,0,0,0.4);
--shadow-lg:0 8px 32px rgba(0,0,0,0.5);
}
html,body,#root{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
::placeholder{color:var(--muted-dim)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--surface-raised);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s,z-index .3s;z-index:30}
.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sidebar-logo{width:40px;height:40px;border-radius:var(--radius);object-fit:contain;flex-shrink:0}
.sidebar-brand{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.2}
.sidebar-brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav-section{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-dim);padding:16px 10px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius);font-size:14px;font-weight:500;color:var(--muted);transition:all .15s;cursor:pointer;position:relative}
.nav-item:hover{background:var(--surface-hover);color:var(--fg)}
.nav-item.active{background:var(--accent-surface);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item svg{width:20px;height:20px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.header{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;flex-shrink:0;background:var(--surface)}
.header-title{font-family:var(--font-display);font-weight:600;font-size:18px;white-space:nowrap}
.header-search{margin-left:auto;position:relative;max-width:320px;width:100%}
.header-search input{width:100%;padding:8px 14px 8px 38px;border-radius:var(--radius);font-size:13px;background:var(--bg);border:1px solid var(--border)}
.header-search input:focus{border-color:var(--accent)}
.header-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted-dim)}
.header-actions{display:flex;align-items:center;gap:8px}
.header-btn{width:38px;height:38px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;transition:background .15s;position:relative}
.header-btn:hover{background:var(--surface-hover)}
.header-btn svg{width:20px;height:20px;color:var(--muted)}
.header-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:2px solid var(--surface)}
.header-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-surface);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--accent)}

.content{flex:1;overflow-y:auto;padding:28px}
.page-enter{animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:border-color .2s}
.kpi-card:hover{border-color:var(--border-light)}
.kpi-label{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.kpi-value{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1}
.kpi-change{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-top:8px;padding:3px 8px;border-radius:6px}
.kpi-change.up{color:var(--success);background:var(--success-surface)}
.kpi-change.down{color:var(--danger);background:var(--danger-surface)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.card-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:var(--font-display);font-weight:600;font-size:15px}
.card-body{padding:20px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;white-space:nowrap}
.badge-accent{color:var(--accent);background:var(--accent-surface)}
.badge-success{color:var(--success);background:var(--success-surface)}
.badge-danger{color:var(--danger);background:var(--danger-surface)}
.badge-warning{color:var(--warning);background:var(--warning-surface)}
.badge-info{color:var(--info);background:var(--info-surface)}
.badge-muted{color:var(--muted);background:rgba(148,163,184,0.1)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-dim);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius);font-size:14px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface-raised);border:1px solid var(--border);color:var(--fg)}.btn-secondary:hover{background:var(--surface-hover);border-color:var(--border-light)}
.btn-ghost{color:var(--muted)}.btn-ghost:hover{background:var(--surface-hover);color:var(--fg)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:6px 12px;font-size:13px}
.btn svg{width:18px;height:18px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 16px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter-bar select{font-size:13px;padding:8px 12px}
.filter-bar input{font-size:13px;padding:8px 12px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);width:90%;max-width:560px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:scaleIn .2s ease}
.modal-header{padding:24px 28px 16px;display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-family:var(--font-display);font-weight:600;font-size:18px}
.modal-body{padding:0 28px 28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;min-height:400px}
.kanban-col{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:10px}
.kanban-col-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.kanban-col-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.kanban-col-count{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-raised);padding:2px 8px;border-radius:10px}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s}
.kanban-card:hover{border-color:var(--border-light);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.kanban-card-title{font-size:14px;font-weight:500;margin-bottom:8px}
.kanban-card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.kanban-card-priority{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.priority-urgent{background:var(--danger)}.priority-high{background:var(--accent)}.priority-medium{background:var(--warning)}.priority-low{background:var(--muted-dim)}

.chart-bar{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart-fill{width:100%;background:var(--accent);border-radius:4px 4px 0 0;transition:height .4s ease;min-height:4px;position:relative}
.chart-fill:hover{background:var(--accent-hover)}
.chart-label{font-size:11px;color:var(--muted-dim)}
.chart-val{font-size:11px;font-weight:600;color:var(--muted)}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius-lg);overflow:hidden}
.cal-head{background:var(--surface-raised);padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.cal-day{background:var(--surface);min-height:90px;padding:8px;cursor:pointer;transition:background .15s}
.cal-day:hover{background:var(--surface-hover)}
.cal-day.today{background:var(--accent-surface)}
.cal-day.other{opacity:.3}
.cal-day-num{font-size:13px;font-weight:600;margin-bottom:4px}
.cal-day.today .cal-day-num{color:var(--accent)}
.cal-event{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event.project{background:var(--info-surface);color:var(--info)}
.cal-event.task{background:var(--accent-surface);color:var(--accent)}
.cal-event.meeting{background:var(--success-surface);color:var(--success)}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.empty-state svg{width:48px;height:48px;color:var(--muted-dim);margin-bottom:16px}
.empty-state h3{font-family:var(--font-display);font-size:18px;margin-bottom:8px}
.empty-state p{color:var(--muted);font-size:14px;max-width:320px}

.detail-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.detail-header .btn-ghost{padding:8px}
.detail-header h1{font-family:var(--font-display);font-size:24px;font-weight:700}

.progress-bar{height:6px;background:var(--surface-raised);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease}

.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:20px}
.timeline-item::before{content:'';position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface-raised);border:2px solid var(--accent)}
.timeline-item .time{font-size:12px;color:var(--muted-dim);margin-bottom:4px}
.timeline-item .desc{font-size:14px}

.hamburger{display:none;width:38px;height:38px;border-radius:var(--radius);align-items:center;justify-content:center}
.hamburger:hover{background:var(--surface-hover)}
.hamburger svg{width:22px;height:22px;color:var(--muted)}
.sidebar-close{display:none}

@media(max-width:1024px){
.kpi-grid{grid-template-columns:repeat(2,1fr)}
.grid-2{grid-template-columns:1fr}
.kanban{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);width:280px;z-index:50}
.sidebar.open{transform:translateX(0)}
.sidebar-close{display:flex}
.hamburger{display:flex}
.content{padding:20px 16px}
.kpi-grid{grid-template-columns:1fr 1fr}
.header{padding:0 16px}
.header-title{font-size:15px}
.kanban{grid-template-columns:1fr}
.calendar{font-size:11px}
.cal-day{min-height:60px;padding:4px}
.form-row{grid-template-columns:1fr}
.detail-header h1{font-size:20px}
}
@media(max-width:480px){
.kpi-grid{grid-template-columns:1fr}
.header-search{display:none}
}

/* Focus-visible for keyboard navigation */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
.kanban-card:hover{transform:none}
}

/* Accent discipline — nav keeps accent for orientation, content minimizes it */
.nav-item.active{background:var(--accent-surface);color:var(--accent)}
.nav-item.active::before{background:var(--accent)}
.nav-item.active svg{color:var(--accent)}
</style>
</head>

function PlanningPage(){
const[y,setY]=useState(2026);const[m,setM]=useState(6);
const months=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const days=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const first=new Date(y,m,1);const last=new Date(y,m+1,0);
let startDay=first.getDay()-1;if(startDay<0)startDay=6;
const totalDays=last.getDate();
const cells=[];
const prev=new Date(y,m,0);
for(let i=startDay-1;i>=0;i--)cells.push({day:prev.getDate()-i,other:true});
for(let d=1;d<=totalDays;d++)cells.push({day:d,other:false,date:`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`});
while(cells.length%7!==0)cells.push({day:cells.length-totalDays-startDay+1,other:true});
const today="2026-07-15";
return(
<div className="page-enter">
<div className="filter-bar" style={{justifyContent:"center",gap:20}}>
<button className="btn btn-ghost" onClick={()=>{if(m===0){setM(11);setY(y-1)}else setM(m-1)}}>←</button>
<span style={{fontFamily:"var(--font-display)",fontWeight:600,fontSize:18}}>{months[m]} {y}</span>
<button className="btn btn-ghost" onClick={()=>{if(m===11){setM(0);setY(y+1)}else setM(m+1)}}>→</button>
</div>
<div className="calendar">
{days.map(d=><div className="cal-head" key={d}>{d}</div>)}
{cells.map((c,i)=>{
const evts=c.date?PLANNING_EVENTS.filter(e=>e.date===c.date):[];
return(
<div key={i} className={`cal-day${c.other?" other":""}${c.date===today?" today":""}`}>
<div className="cal-day-num">{c.day}</div>
{evts.map((e,j)=><div key={j} className={`cal-event ${e.type}`}>{e.label}</div>)}
</div>
);
})}
</div>
</div>
);
}
